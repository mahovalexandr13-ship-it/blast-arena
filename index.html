<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arena Blast">
<link rel="manifest" href="manifest.webmanifest">
<title>Arena Blast</title>
<style>
:root{--glass:#0a1220cc;--stroke:#7890ad66;--gold:#ffd646}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d17;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#152238}
canvas{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.screen.active{display:flex}
#menu{background:radial-gradient(circle at 50% 25%,#40699b,#121b2e 68%,#0b101b)}
.brand{font-size:clamp(42px,9vw,90px);font-weight:1000;letter-spacing:2px;text-shadow:0 7px #06101d,0 0 30px #55c7ff;margin-bottom:8px}
.sub{opacity:.8;margin:0 0 28px;font-weight:700}
.panel{width:min(820px,94vw);padding:22px;border:2px solid var(--stroke);border-radius:26px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 20px 55px #0008}
.btnrow{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
button{border:0;border-radius:16px;color:#fff;padding:15px 26px;font:900 20px Arial;background:#347cf6;box-shadow:inset 0 -6px #164ba8,0 7px 17px #0007}
button:active{transform:translateY(3px);box-shadow:inset 0 -2px #164ba8}
.secondary{background:#35445d;box-shadow:inset 0 -6px #202b3d,0 7px 17px #0007}
.gold{background:#e5bd2f;box-shadow:inset 0 -6px #8c6b12,0 7px 17px #0007}
#fighters{background:linear-gradient(#15253d,#0a1322)}
.cards{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin:16px 0}
.card{width:205px;padding:14px;text-align:center;border:3px solid #405575;border-radius:20px;background:#1d2b42}
.card.selected{border-color:var(--gold);box-shadow:0 0 28px #ffd64655}
.portrait{height:125px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:70px;margin-bottom:10px;background:linear-gradient(145deg,#80ddff,#3767bd)}
.card:nth-child(2) .portrait{background:linear-gradient(145deg,#ffbd77,#bc4a4d)}
.card:nth-child(3) .portrait{background:linear-gradient(145deg,#b7ff8c,#3d9861)}
.small{font-size:14px;color:#c0cee1}
.hud{pointer-events:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:5}
.hbadge{background:#07111ddd;border:2px solid #66809e88;border-radius:13px;padding:8px 12px;font-weight:900;min-width:175px}
.bar{height:15px;margin-top:5px;background:#2a1620;border-radius:9px;overflow:hidden;border:1px solid #fff3}
.fill{height:100%}
#hp{background:#46e36d}#ehp{background:#ff505c}#sp{background:#ffd531;width:0}
#superMeter{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:min(250px,32vw);height:15px;background:#2c2410;border:2px solid #fff4;border-radius:12px;overflow:hidden}
.controls{position:absolute;inset:0;pointer-events:none}
.joy{position:absolute;width:150px;height:150px;bottom:max(24px,env(safe-area-inset-bottom));border-radius:50%;background:#ffffff16;border:3px solid #ffffff2e;pointer-events:auto}
#moveJoy{left:20px}#aimJoy{right:20px}
.knob{position:absolute;width:64px;height:64px;left:40px;top:40px;border-radius:50%;background:#ffffff48;border:3px solid #fff7;box-shadow:0 5px 15px #0005}
.action{position:absolute;bottom:max(50px,env(safe-area-inset-bottom));width:78px;height:78px;padding:0;border-radius:50%;pointer-events:auto}
#attack{right:180px;background:#ef4c57;box-shadow:inset 0 -7px #a1212c,0 7px 18px #0007}
#super{right:275px;background:#e7c42e;box-shadow:inset 0 -7px #927013,0 7px 18px #0007;opacity:.45}
#pause{position:absolute;right:12px;top:58px;width:45px;height:45px;padding:0;font-size:18px;pointer-events:auto;background:#2d3e58;box-shadow:inset 0 -4px #172235}
#message{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:none;text-align:center;font-size:clamp(42px,8vw,90px);font-weight:1000;text-shadow:0 6px #000;z-index:10}
#pausePanel{display:none;z-index:20}
#install{display:none;margin-top:12px;width:100%}
@media(max-width:700px){
 .card{width:150px}.portrait{height:92px;font-size:50px}.panel{padding:15px}
 .hbadge{min-width:125px}.bar{width:125px}
 .joy{width:130px;height:130px}.knob{width:56px;height:56px;left:34px;top:34px}
 #attack{right:166px;width:66px;height:66px}#super{right:240px;width:66px;height:66px}
}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>

<section id="menu" class="screen active">
  <div class="brand">ARENA BLAST</div>
  <p class="sub">Мобильная аренная битва</p>
  <div class="panel">
    <div class="btnrow">
      <button id="play">ИГРАТЬ</button>
      <button id="fightersBtn" class="secondary">БОЙЦЫ</button>
    </div>
    <button id="install" class="gold">УСТАНОВИТЬ НА ТЕЛЕФОН</button>
    <p class="small" style="text-align:center;margin-bottom:0">Работает офлайн после установки. Поверни телефон горизонтально.</p>
  </div>
</section>

<section id="fighters" class="screen">
  <div class="panel">
    <h2 style="text-align:center;margin-top:0">ВЫБЕРИ БОЙЦА</h2>
    <div class="cards">
      <div class="card selected" data-f="0"><div class="portrait">⚡</div><b>НОВА</b><p class="small">Скорость и точная стрельба</p></div>
      <div class="card" data-f="1"><div class="portrait">🔥</div><b>РЭЙ</b><p class="small">Очень сильный выстрел</p></div>
      <div class="card" data-f="2"><div class="portrait">🌿</div><b>МОХ</b><p class="small">Много здоровья и стойкость</p></div>
    </div>
    <div class="btnrow"><button id="back" class="secondary">НАЗАД</button><button id="start">В БОЙ</button></div>
  </div>
</section>

<section id="battle" class="screen hud">
  <div class="top">
    <div class="hbadge">ТЫ<div class="bar"><div id="hp" class="fill"></div></div></div>
    <div id="superMeter"><div id="sp" class="fill"></div></div>
    <div class="hbadge" style="text-align:right">БОТ<div class="bar"><div id="ehp" class="fill"></div></div></div>
  </div>
  <div class="controls">
    <div id="moveJoy" class="joy"><div class="knob"></div></div>
    <div id="aimJoy" class="joy"><div class="knob"></div></div>
    <button id="super" class="action">★</button>
    <button id="attack" class="action">●</button>
    <button id="pause">Ⅱ</button>
  </div>
  <div id="message"></div>
</section>

<section id="pausePanel" class="screen">
  <div class="panel" style="max-width:430px;text-align:center">
    <h2>ПАУЗА</h2>
    <div class="btnrow"><button id="resume">ПРОДОЛЖИТЬ</button><button id="menuBtn" class="secondary">В МЕНЮ</button></div>
  </div>
</section>
</div>

<script>
const C=document.getElementById('game'),X=C.getContext('2d');let W=0,H=0,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0)} addEventListener('resize',resize);resize();

const screens={menu:document.getElementById('menu'),fighters:document.getElementById('fighters'),battle:document.getElementById('battle'),pause:document.getElementById('pausePanel')};
function show(k){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[k].classList.add('active')}
let fighter=0;
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{document.querySelectorAll('.card').forEach(v=>v.classList.remove('selected'));c.classList.add('selected');fighter=+c.dataset.f});
fightersBtn.onclick=()=>show('fighters');back.onclick=()=>show('menu');play.onclick=startGame;start.onclick=startGame;

const move={x:0,y:0},aim={x:1,y:0};let attackHeld=false;
function joystick(el,obj){
 const k=el.querySelector('.knob');let on=false;
 function set(e){const r=el.getBoundingClientRect(),p=e.touches?e.touches[0]:e;let x=(p.clientX-r.left-r.width/2)/(r.width/2),y=(p.clientY-r.top-r.height/2)/(r.height/2),m=Math.hypot(x,y);if(m>1){x/=m;y/=m}obj.x=x;obj.y=y;k.style.transform=`translate(${x*36}px,${y*36}px)`}
 function end(){on=false;obj.x=0;obj.y=0;k.style.transform='translate(0,0)'}
 el.addEventListener('pointerdown',e=>{on=true;el.setPointerCapture(e.pointerId);set(e)});el.addEventListener('pointermove',e=>on&&set(e));el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)
}joystick(moveJoy,move);joystick(aimJoy,aim);
attack.onpointerdown=()=>attackHeld=true;attack.onpointerup=attack.onpointercancel=()=>attackHeld=false;

let game=null,last=performance.now(),paused=false;
const ST=[{hp:3600,speed:255,damage:430,rate:.42,color:'#39bdf8',icon:'⚡'},
{hp:3200,speed:215,damage:650,rate:.70,color:'#ff8057',icon:'🔥'},
{hp:4800,speed:180,damage:350,rate:.52,color:'#66cd75',icon:'🌿'}];

function startGame(){show('battle');paused=false;const s=ST[fighter];game={run:true,p:{x:W*.23,y:H*.55,r:25,hp:s.hp,max:s.hp,cd:0,super:0},e:{x:W*.77,y:H*.45,r:27,hp:4200,max:4200,cd:.5},b:[],fx:[],walls:[]};const q=Math.min(W,H);game.walls=[{x:W*.48,y:H*.29,w:q*.15,h:30},{x:W*.38,y:H*.67,w:q*.15,h:30},{x:W*.68,y:H*.57,w:q*.16,h:30}];message.style.display='none';last=performance.now();requestAnimationFrame(loop)}

function hitCircleRect(x,y,r,q){const nx=Math.max(q.x,Math.min(x,q.x+q.w)),ny=Math.max(q.y,Math.min(y,q.y+q.h));return (x-nx)**2+(y-ny)**2<r*r}
function moveObj(o,dx,dy){let nx=Math.max(o.r,Math.min(W-o.r,o.x+dx)),ny=Math.max(o.r,Math.min(H-o.r,o.y+dy));if(!game.walls.some(q=>hitCircleRect(nx,ny,o.r,q))){o.x=nx;o.y=ny}}
function fire(o,dx,dy,owner,damage,superShot=false){let m=Math.hypot(dx,dy)||1;game.b.push({x:o.x+dx/m*(o.r+8),y:o.y+dy/m*(o.r+8),vx:dx/m*600,vy:dy/m*600,r:superShot?11:7,owner,damage,life:1.25,big:superShot})}
function fx(x,y,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=80+Math.random()*240;game.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.45,r:2+Math.random()*5})}}
function shoot(){const p=game.p,s=ST[fighter],dx=aim.x||game.e.x-p.x,dy=aim.y||game.e.y-p.y;fire(p,dx,dy,'p',s.damage);p.cd=s.rate;p.super=Math.min(100,p.super+7)}
function superShot(){if(!game||!game.run||game.p.super<100)return;game.p.super=0;const p=game.p,e=game.e,a=Math.atan2(e.y-p.y,e.x-p.x);for(let i=-2;i<=2;i++)fire(p,Math.cos(a+i*.12),Math.sin(a+i*.12),'p',ST[fighter].damage*1.45,true);fx(p.x,p.y,28)}
super.onclick=superShot;
function enemyShoot(){const p=game.p,e=game.e;fire(e,p.x-e.x,p.y-e.y,'e',350);e.cd=.8}

function update(dt){
 if(!game||!game.run||paused)return;
 const p=game.p,e=game.e,s=ST[fighter];p.cd-=dt;e.cd-=dt;
 moveObj(p,move.x*s.speed*dt,move.y*s.speed*dt);
 let dx=e.x-p.x,dy=e.y-p.y,m=Math.hypot(dx,dy)||1;
 if(!(aim.x||aim.y)){aim.x=dx/m;aim.y=dy/m}
 if(attackHeld&&p.cd<=0)shoot();
 let edx=p.x-e.x,edy=p.y-e.y,em=Math.hypot(edx,edy)||1,ex=0,ey=0;
 if(em>260){ex=edx/em;ey=edy/em}else if(em<155){ex=-edx/em;ey=-edy/em}
 moveObj(e,ex*115*dt,ey*115*dt);if(e.cd<=0&&em<700)enemyShoot();
 for(let i=game.b.length-1;i>=0;i--){let b=game.b[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  if(b.life<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50||game.walls.some(q=>hitCircleRect(b.x,b.y,b.r,q))){game.b.splice(i,1);continue}
  const t=b.owner==='p'?e:p;
  if(Math.hypot(b.x-t.x,b.y-t.y)<b.r+t.r){t.hp-=b.damage;if(b.owner==='p')p.super=Math.min(100,p.super+5);fx(b.x,b.y,9);game.b.splice(i,1)}
 }
 for(let i=game.fx.length-1;i>=0;i--){let z=game.fx[i];z.x+=z.vx*dt;z.y+=z.vy*dt;z.vx*=.94;z.vy*=.94;z.life-=dt;if(z.life<=0)game.fx.splice(i,1)}
 hp.style.width=Math.max(0,p.hp/p.max*100)+'%';ehp.style.width=Math.max(0,e.hp/e.max*100)+'%';sp.style.width=p.super+'%';super.style.opacity=p.super>=100?1:.45;
 if(p.hp<=0)finish(false);else if(e.hp<=0)finish(true)
}
function finish(win){game.run=false;message.textContent=win?'ПОБЕДА!':'ПОРАЖЕНИЕ';message.style.display='block';setTimeout(()=>show('menu'),2200)}
function draw(){
 X.clearRect(0,0,W,H);if(!game)return;
 X.fillStyle='#2d4b35';X.fillRect(0,0,W,H);
 X.strokeStyle='#ffffff10';for(let x=0;x<W;x+=42){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke()}for(let y=0;y<H;y+=42){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}
 game.walls.forEach(q=>{X.fillStyle='#596c51';X.fillRect(q.x,q.y,q.w,q.h);X.fillStyle='#7b8d68';X.fillRect(q.x,q.y,q.w,7)});
 game.b.forEach(b=>{X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fillStyle=b.owner==='p'?'#75dcff':'#ff6570';X.shadowBlur=b.big?18:8;X.fill();X.shadowBlur=0});
 character(game.p,ST[fighter].color,ST[fighter].icon);character(game.e,'#ef5350','★');
 game.fx.forEach(z=>{X.globalAlpha=Math.max(0,z.life/.8);X.beginPath();X.arc(z.x,z.y,z.r,0,Math.PI*2);X.fillStyle='#ffe36a';X.fill();X.globalAlpha=1});
}
function character(o,c,icon){X.beginPath();X.arc(o.x,o.y,o.r,0,Math.PI*2);X.fillStyle=c;X.fill();X.lineWidth=4;X.strokeStyle='#08111f';X.stroke();X.font=`900 ${Math.round(o.r)}px Arial`;X.textAlign='center';X.textBaseline='middle';X.fillStyle='#fff';X.fillText(icon,o.x,o.y);X.fillStyle='#2a1018';X.fillRect(o.x-o.r,o.y-o.r-14,o.r*2,7);X.fillStyle='#47e36c';X.fillRect(o.x-o.r,o.y-o.r-14,o.r*2*Math.max(0,o.hp/o.max),7);X.textBaseline='alphabetic'}

pause.onclick=()=>{if(!game||!game.run)return;paused=true;show('pause')};resume.onclick=()=>{paused=false;show('battle');last=performance.now();requestAnimationFrame(loop)};menuBtn.onclick=()=>{if(game)game.run=false;paused=false;show('menu')};

function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(game&&game.run&&!paused)requestAnimationFrame(loop)}

let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'});
install.onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.style.display='none'};
</script>
</body>
</html>
